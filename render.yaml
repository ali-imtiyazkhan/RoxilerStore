services:
  - type: web
    name: roxiler-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: bun install && tsc && bunx prisma generate --schema=prisma/schema.prisma
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
    autoDeploy: true