services:
  - type: web
    name: roxiler-backend
    runtime: node
    buildCommand: bun install && bun run --filter=@roxiler/backend db:generate && bun run build && bun run --filter=@roxiler/backend db:migrate:deploy
    startCommand: node apps/backend/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
    autoDeploy: true
